<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACTIVA · Panel de Calidad de Servicio — Cliente Incógnito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="assets/logo.jpg" alt="InmoTrack.cl" /></div>
      <div class="brand-title">Panel · ACTIVA</div>
    </div>

    <nav class="tab-nav">
      <button class="tab-btn is-active" data-tab="resumen"><span class="tab-num">01</span>ACTIVA vs. Competencia</button>
      <button class="tab-btn" data-tab="activa"><span class="tab-num">02</span>Análisis Comercial</button>
      <button class="tab-btn" data-tab="detalle"><span class="tab-num">03</span>Datos de Visitas</button>
    </nav>

    <div class="sidebar-footer">
      Datos actualizados por el equipo Terrabit/ACTIVA.
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 id="page-title">ACTIVA vs. Competencia</h1>
        <div class="page-sub" id="page-sub">Índice de calidad de servicio ACTIVA vs. competencia — global o por cluster de competencia directa.</div>
      </div>
    </div>

    <section class="tab-panel is-active" id="panel-resumen"></section>
    <section class="tab-panel" id="panel-activa"></section>
    <section class="tab-panel" id="panel-detalle"></section>
  </main>
</div>

<script>window.PRODUCTION_MODE = true;</script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script>
  const TITLES = {
    resumen: ['ACTIVA vs. Competencia', 'Índice de calidad de servicio ACTIVA vs. competencia — global o por cluster de competencia directa.'],
    activa: ['Análisis Comercial', 'Desempeño de los proyectos propios de Inmobiliaria Activa, con opción de sumar proyectos de la competencia a la comparación.'],
    detalle: ['Datos de Visitas', 'Todas las visitas, filtrables y ordenables por columna.'],
  };
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const [title, sub] = TITLES[btn.dataset.tab];
      document.getElementById('page-title').textContent = title;
      document.getElementById('page-sub').textContent = sub;
    });
  });
</script>
</body>
</html>
